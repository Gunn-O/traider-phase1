<!-- Weekly Coach - Calendar Analyst -->
<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Hoodie body -->
  <rect x="58" y="158" width="84" height="102" rx="12" fill="#1a3a6a"/>

  <!-- Hoodie pocket -->
  <rect x="78" y="210" width="44" height="30" rx="6" fill="#152d55"/>

  <!-- Neck -->
  <rect x="88" y="140" width="24" height="23" fill="#f0b090"/>

  <!-- Head -->
  <ellipse cx="100" cy="118" rx="43" ry="49" fill="#f0b090"/>

  <!-- Wavy brown hair -->
  <ellipse cx="100" cy="80" rx="44" ry="24" fill="#5c3317"/>
  <rect x="56" y="82" width="13" height="40" rx="6" fill="#5c3317"/>
  <rect x="131" y="82" width="13" height="40" rx="6" fill="#5c3317"/>

  <!-- Hair waves detail -->
  <path d="M 60 88 Q 70 82 80 88 Q 90 94 100 88 Q 110 82 120 88 Q 130 94 140 88" stroke="#7a4520" stroke-width="2" fill="none"/>

  <!-- Eyes — friendly big -->
  <ellipse cx="84" cy="117" rx="10" ry="11" fill="#ffffff"/>
  <ellipse cx="116" cy="117" rx="10" ry="11" fill="#ffffff"/>
  <ellipse cx="85" cy="118" rx="7" ry="7.5" fill="#1a3a6a"/>
  <ellipse cx="117" cy="118" rx="7" ry="7.5" fill="#1a3a6a"/>
  <circle cx="82" cy="115" r="2.5" fill="#ffffff"/>
  <circle cx="114" cy="115" r="2.5" fill="#ffffff"/>

  <!-- Eyebrows — friendly -->
  <path d="M 75 105 Q 84 101 93 105" stroke="#5c3317" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 107 105 Q 116 101 125 105" stroke="#5c3317" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="100" cy="130" rx="3" ry="2" fill="#d4906a"/>

  <!-- Smile -->
  <path d="M 88 142 Q 100 152 112 142" stroke="#b06040" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Clipboard -->
  <rect x="130" y="168" width="42" height="55" rx="3" fill="#f5f0e0" stroke="#ccb870" stroke-width="1.5"/>

  <!-- Clipboard clip -->
  <rect x="143" y="163" width="16" height="10" rx="3" fill="#ccb870"/>

  <!-- Lines on clipboard -->
  <line x1="136" y1="185" x2="166" y2="185" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="136" y1="193" x2="166" y2="193" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="136" y1="201" x2="155" y2="201" stroke="#aaaaaa" stroke-width="1"/>

  <!-- Check marks -->
  <path d="M 136 178 L 139 182 L 145 174" stroke="#00aaff" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Arms -->
  <rect x="26" y="162" width="34" height="14" rx="7" fill="#1a3a6a"/>
  <rect x="140" y="162" width="34" height="14" rx="7" fill="#1a3a6a"/>
  <ellipse cx="28" cy="169" rx="10" ry="9" fill="#f0b090"/>
</svg>
