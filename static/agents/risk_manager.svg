<!-- Risk Manager - Shield Guardian -->
<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Body armor -->
  <rect x="55" y="155" width="90" height="105" rx="12" fill="#3a3a4a"/>

  <!-- Armor chest plate -->
  <ellipse cx="100" cy="185" rx="35" ry="28" fill="#4a4a5a"/>

  <!-- SL/TP badge -->
  <circle cx="100" cy="183" r="16" fill="#ffaa00" opacity="0.9"/>
  <text x="100" y="188" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1a1a" font-family="monospace">SL/TP</text>

  <!-- Neck -->
  <rect x="88" y="138" width="24" height="22" fill="#d4956a"/>

  <!-- Head -->
  <ellipse cx="100" cy="115" rx="44" ry="50" fill="#d4956a"/>

  <!-- Short silver hair -->
  <ellipse cx="100" cy="78" rx="44" ry="22" fill="#a0a0b0"/>
  <rect x="56" y="80" width="14" height="35" rx="7" fill="#a0a0b0"/>
  <rect x="130" y="80" width="14" height="35" rx="7" fill="#a0a0b0"/>

  <!-- Eyes — sharp determined -->
  <ellipse cx="84" cy="115" rx="9" ry="8" fill="#ffffff"/>
  <ellipse cx="116" cy="115" rx="9" ry="8" fill="#ffffff"/>
  <ellipse cx="85" cy="116" rx="6" ry="5.5" fill="#2a1a3a"/>
  <ellipse cx="117" cy="116" rx="6" ry="5.5" fill="#2a1a3a"/>
  <circle cx="87" cy="114" r="2" fill="#ffffff"/>
  <circle cx="119" cy="114" r="2" fill="#ffffff"/>

  <!-- Eyebrows — stern -->
  <line x1="76" y1="105" x2="94" y2="108" stroke="#707080" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="106" y1="108" x2="124" y2="105" stroke="#707080" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="100" cy="128" rx="3" ry="2.5" fill="#c07850"/>

  <!-- Mouth — serious -->
  <line x1="90" y1="140" x2="110" y2="140" stroke="#a05a35" stroke-width="2" stroke-linecap="round"/>

  <!-- Shield -->
  <path d="M 25 170 L 25 210 Q 25 230 45 240 Q 55 245 55 245 L 55 170 Z" fill="#ffaa00" opacity="0.9"/>
  <path d="M 25 170 L 55 170 L 55 245 Q 40 250 25 240 Z" fill="#ff8800" opacity="0.7"/>

  <!-- Shield cross -->
  <line x1="40" y1="185" x2="40" y2="230" stroke="#ffffff" stroke-width="3"/>
  <line x1="28" y1="205" x2="52" y2="205" stroke="#ffffff" stroke-width="3"/>

  <!-- Arms -->
  <rect x="145" y="160" width="30" height="15" rx="7" fill="#3a3a4a"/>
  <ellipse cx="173" cy="167" rx="10" ry="9" fill="#d4956a"/>
</svg>
