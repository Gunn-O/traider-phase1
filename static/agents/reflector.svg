<!-- Reflector - Trade Reviewer -->
<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark casual top -->
  <rect x="58" y="157" width="84" height="103" rx="12" fill="#1a1a2e"/>

  <!-- Hoodie drawstring -->
  <line x1="90" y1="158" x2="86" y2="185" stroke="#2a2a4a" stroke-width="2"/>
  <line x1="110" y1="158" x2="114" y2="185" stroke="#2a2a4a" stroke-width="2"/>

  <!-- Neck -->
  <rect x="88" y="140" width="24" height="22" fill="#f5d0b0"/>

  <!-- Head -->
  <ellipse cx="100" cy="118" rx="43" ry="49" fill="#f5d0b0"/>

  <!-- Long dark hair -->
  <ellipse cx="100" cy="78" rx="44" ry="22" fill="#0a0a14"/>
  <rect x="56" y="80" width="13" height="55" rx="6" fill="#0a0a14"/>
  <rect x="131" y="80" width="13" height="55" rx="6" fill="#0a0a14"/>

  <!-- Hair front strands -->
  <path d="M 72 80 Q 68 110 72 130" stroke="#0a0a14" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Eyes — observant calm -->
  <ellipse cx="84" cy="118" rx="9" ry="9" fill="#ffffff"/>
  <ellipse cx="116" cy="118" rx="9" ry="9" fill="#ffffff"/>
  <ellipse cx="85" cy="119" rx="6" ry="6" fill="#0a0a1a"/>
  <ellipse cx="117" cy="119" rx="6" ry="6" fill="#0a0a1a"/>
  <circle cx="83" cy="117" r="2" fill="#ffffff"/>
  <circle cx="115" cy="117" r="2" fill="#ffffff"/>

  <!-- Subtle eyebrows -->
  <line x1="76" y1="107" x2="93" y2="107" stroke="#0a0a14" stroke-width="2" stroke-linecap="round"/>
  <line x1="107" y1="107" x2="124" y2="107" stroke="#0a0a14" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="100" cy="131" rx="3" ry="2" fill="#d4a080"/>

  <!-- Neutral expression -->
  <line x1="91" y1="143" x2="109" y2="143" stroke="#b07850" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Notebook -->
  <rect x="128" y="165" width="38" height="50" rx="4" fill="#2a1a0a"/>

  <!-- Notebook spine -->
  <rect x="128" y="165" width="6" height="50" rx="2" fill="#1a0a00"/>

  <!-- Notebook lines -->
  <line x1="139" y1="178" x2="160" y2="178" stroke="#4a3a2a" stroke-width="1"/>
  <line x1="139" y1="186" x2="160" y2="186" stroke="#4a3a2a" stroke-width="1"/>
  <line x1="139" y1="194" x2="160" y2="194" stroke="#4a3a2a" stroke-width="1"/>
  <line x1="139" y1="202" x2="152" y2="202" stroke="#4a3a2a" stroke-width="1"/>

  <!-- Pen writing -->
  <rect x="158" y="178" width="3" height="18" rx="1" fill="#cccccc" transform="rotate(-20 160 188)"/>

  <!-- Arms -->
  <rect x="26" y="162" width="34" height="14" rx="7" fill="#1a1a2e"/>
  <rect x="140" y="162" width="34" height="14" rx="7" fill="#1a1a2e"/>
  <ellipse cx="28" cy="169" rx="10" ry="9" fill="#f5d0b0"/>
</svg>
